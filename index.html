<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Chat — a premium, responsive AI chat interface." />
  <title>AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✦</div><span>AI Chat</span></div>
      <button class="new-chat" id="newChat">＋ New chat</button>
      <div class="sidebar-label">Recent</div>
      <div class="history" id="history"></div>
      <div class="sidebar-bottom">
        <button class="side-btn" id="themeToggle">◐ <span>Toggle theme</span></button>
        <button class="side-btn" id="clearChats">⌫ <span>Clear chats</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu">☰</button>
        <div>
          <div class="model-row"><span class="status-dot"></span><strong>AI Assistant</strong><span class="pill">Online</span></div>
          <div class="subtle">Fast, helpful, and ready to chat</div>
        </div>
        <div class="top-actions"><button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button></div>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h1>What can I help you build?</h1>
          <p>Ask a question, brainstorm an idea, or start building something new.</p>
          <div class="suggestions">
            <button data-prompt="Create a modern portfolio website">Create a modern portfolio</button>
            <button data-prompt="Explain JavaScript promises simply">Explain JavaScript simply</button>
            <button data-prompt="Give me 5 startup ideas for students">Give me startup ideas</button>
            <button data-prompt="Help me debug my code">Help me debug code</button>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="1" placeholder="Message AI Chat..." autocomplete="off"></textarea>
          <div class="composer-bottom">
            <span class="hint">Enter to send · Shift + Enter for new line</span>
            <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">↑</button>
          </div>
        </form>
        <div class="disclaimer">AI can make mistakes. Verify important information.</div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
